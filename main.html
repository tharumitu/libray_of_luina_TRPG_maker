<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library of Ruina TRPG Character Sheet</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Serif+JP:wght@500;700;900&display=swap');

    :root {
      --bg-dark: #070709;
      --panel-bg: rgba(15, 15, 18, 0.9);
      --border-gold: #c5a059;
      --border-gold-dark: #5c4722;
      --text-main: #e2ded0;
      --text-gold: #e8c374;
      --text-muted: #8a8880;

      /* レアリティカラー */
      --rarity-paper: #8a8e91;
      --rarity-common: #2d8a34;
      --rarity-uncommon: #226bba;
      --rarity-rare: #8222ba;
      --rarity-unique: #c48b18;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Cinzel', 'Noto Serif JP', serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(20, 20, 30, 0.8), #030304),
        linear-gradient(rgba(197, 160, 89, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(197, 160, 89, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      color: var(--text-main);
      margin: 0;
      padding: 30px 15px;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--panel-bg);
      border: 2px solid var(--border-gold);
      box-shadow: 0 0 20px rgba(0,0,0,0.9), inset 0 0 15px rgba(0,0,0,0.8);
      padding: 30px;
      position: relative;
    }

    .header {
      text-align: center;
      border-bottom: 2px solid var(--border-gold);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 2.2rem;
      color: var(--text-gold);
      letter-spacing: 4px;
      margin: 0;
      text-shadow: 0 0 10px rgba(232, 195, 116, 0.4);
    }

    .section-title {
      color: var(--text-gold);
      font-size: 1.1rem;
      letter-spacing: 2px;
      border-left: 4px solid var(--border-gold);
      padding-left: 10px;
      margin-top: 30px;
      margin-bottom: 15px;
      background: linear-gradient(90deg, rgba(197, 160, 89, 0.15), transparent);
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }

    .form-group { margin-bottom: 15px; }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      background: #0d0d11;
      border: 1px solid var(--border-gold-dark);
      color: var(--text-main);
      padding: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--border-gold);
      box-shadow: 0 0 8px rgba(197, 160, 89, 0.4);
    }

    /* --- Ruina原作風 2画面対話型カードデザイン --- */
    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .ruina-card {
      display: flex;
      background: #08080a;
      border: 2px solid var(--rarity-common);
      box-shadow: 0 0 15px rgba(0,0,0,0.9);
      position: relative;
      height: 230px;
      border-radius: 4px;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }

    .ruina-card:hover {
      transform: translateY(-2px);
    }

    .ruina-card[data-rarity="paper"] { border-color: var(--rarity-paper); }
    .ruina-card[data-rarity="common"] { border-color: var(--rarity-common); }
    .ruina-card[data-rarity="uncommon"] { border-color: var(--rarity-uncommon); }
    .ruina-card[data-rarity="rare"] { border-color: var(--rarity-rare); }
    .ruina-card[data-rarity="unique"] { border-color: var(--rarity-unique); }

    /* カード左側（イラスト＆ヘッダー部） */
    .card-left {
      width: 48%;
      border-right: 2px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      position: relative;
      background: #0d0d12;
    }

    /* 上部ヘッダー（コスト・名前・アイコン） */
    .card-banner {
      background: var(--rarity-common);
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 6px;
      gap: 6px;
      position: relative;
    }
    .ruina-card[data-rarity="paper"] .card-banner { background: var(--rarity-paper); }
    .ruina-card[data-rarity="common"] .card-banner { background: var(--rarity-common); }
    .ruina-card[data-rarity="uncommon"] .card-banner { background: var(--rarity-uncommon); }
    .ruina-card[data-rarity="rare"] .card-banner { background: var(--rarity-rare); }
    .ruina-card[data-rarity="unique"] .card-banner { background: var(--rarity-unique); }

    /* 円形コストアイコン */
    .cost-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #0a0a0d;
      border: 2px solid #fff;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1rem;
      flex-shrink: 0;
      box-shadow: 0 0 5px rgba(0,0,0,0.8);
    }

    .card-name-input {
      background: transparent;
      border: none;
      color: #fff;
      font-weight: bold;
      font-size: 0.9rem;
      width: 100%;
      padding: 0;
      text-shadow: 1px 1px 2px #000;
    }

    /* 攻撃タイプアイコン */
    .type-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      border: 1px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #fff;
      flex-shrink: 0;
    }

    /* イラスト表示エリア */
    .card-art-area {
      flex: 1;
      background: radial-gradient(circle, #252530 0%, #08080a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 0.75rem;
      position: relative;
      overflow: hidden;
    }

    /* 設定用設定パネル（カード上部に重なるコントロール部） */
    .card-controls {
      background: rgba(10, 10, 14, 0.95);
      padding: 6px;
      display: flex;
      gap: 4px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .card-controls input, .card-controls select {
      font-size: 0.7rem;
      padding: 2px 4px;
      height: 24px;
    }

    /* カード右側（効果テキスト＆ダイス） */
    .card-right {
      width: 52%;
      padding: 8px;
      display: flex;
      flex-direction: column;
      background: #050507;
    }

    .card-right textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: #ddd;
      font-size: 0.8rem;
      line-height: 1.35;
      resize: none;
      padding: 0;
      box-shadow: none;
    }
    .card-right textarea:focus {
      box-shadow: none;
    }

    .card-footer-btns {
      display: flex;
      justify-content: flex-end;
      padding-top: 4px;
    }

    /* ボタン */
    .btn {
      background: linear-gradient(180deg, #2a251a, #14120d);
      border: 1px solid var(--border-gold);
      color: var(--text-gold);
      padding: 10px 20px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: linear-gradient(180deg, #423a28, #221e15);
      color: #fff;
      box-shadow: 0 0 10px rgba(232, 195, 116, 0.4);
    }

    .btn-add {
      width: 100%;
      background: rgba(15, 15, 20, 0.8);
      border: 1px dashed var(--border-gold-dark);
      color: var(--text-muted);
      padding: 12px;
    }

    .btn-danger {
      background: rgba(60, 10, 10, 0.8);
      border: 1px solid #8b2525;
      color: #ffaaaa;
      padding: 2px 6px;
      font-size: 0.7rem;
    }

    .btn-ccfolia {
      background: linear-gradient(180deg, #8c6e33, #423213);
      border: 2px solid var(--border-gold);
      color: #fff;
      font-size: 1.1rem;
      width: 100%;
      padding: 16px;
      margin-top: 25px;
    }

    #statusMsg {
      text-align: center;
      color: #28b5c4;
      font-weight: bold;
      margin-top: 15px;
      height: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>LIBRARY OF RUINA</h1>
    <div style="font-size:0.8rem; color:var(--text-muted);">TRPG CHARACTER & BATTLE PAGE SYSTEM</div>
  </div>

  <!-- 基本情報 -->
  <div class="section-title">SPECIFICATION // 基本情報</div>
  <div class="grid-2">
    <div class="form-group">
      <label>名前 (NAME)</label>
      <input type="text" id="charName" value="" placeholder="キャラクター名を入力">
    </div>
    <div class="form-group">
      <label>肩書き (TITLE)</label>
      <input type="text" id="charClass" value="" placeholder="例: 9級フィクサー / 漆黒の苦痛">
    </div>
  </div>

  <!-- ステータス -->
  <div class="section-title">VITAL STATUS // ステータス</div>
  <div class="grid-3">
    <div class="form-group">
      <label>体力 (HP)</label>
      <input type="number" id="hp" value="50">
    </div>
    <div class="form-group">
      <label>混乱抵抗値 (STAGGER)</label>
      <input type="number" id="stagger" value="30">
    </div>
    <div class="form-group">
      <label>最大光 (MAX LIGHT)</label>
      <input type="number" id="light" value="3">
    </div>
  </div>
  <div class="grid-2">
    <div class="form-group">
      <label>速度ダイス数</label>
      <input type="number" id="speedDiceCount" value="1">
    </div>
    <div class="form-group">
      <label>速度ダイス面 (例: 1d6)</label>
      <input type="text" id="speedDiceFormula" value="1d6">
    </div>
  </div>

  <!-- 攻撃耐性 -->
  <div class="section-title">RESISTANCE // 攻撃耐性</div>
  <div class="grid-3">
    <div class="form-group">
      <label>斬撃 (SLASH)</label>
      <select id="resSlash">
        <option value="脆弱(x2.0)">脆弱 (x2.0)</option>
        <option value="一般(x1.0)" selected>一般 (x1.0)</option>
        <option value="耐性(x0.5)">耐性 (x0.5)</option>
      </select>
    </div>
    <div class="form-group">
      <label>貫通 (PIERCE)</label>
      <select id="resPierce">
        <option value="脆弱(x2.0)">脆弱 (x2.0)</option>
        <option value="一般(x1.0)" selected>一般 (x1.0)</option>
        <option value="耐性(x0.5)">耐性 (x0.5)</option>
      </select>
    </div>
    <div class="form-group">
      <label>打撃 (BLUNT)</label>
      <select id="resBlunt">
        <option value="脆弱(x2.0)">脆弱 (x2.0)</option>
        <option value="一般(x1.0)" selected>一般 (x1.0)</option>
        <option value="耐性(x0.5)">耐性 (x0.5)</option>
      </select>
    </div>
  </div>

  <!-- バトルページ（カード）構築 -->
  <div class="section-title">DECK BUILD // バトルページ構築</div>
  
  <div id="deckContainer" class="deck-grid"></div>
  
  <button type="button" class="btn btn-add" onclick="addPage()">+ ADD NEW BATTLE PAGE</button>

  <!-- 出力 -->
  <button type="button" class="btn btn-ccfolia" onclick="copyCcfoliaJson()">
    EXPORT TO CCFOLIA (ココフォリア出力)
  </button>
  <div id="statusMsg"></div>
</div>

<script>
  let pages = [];

  function renderPages() {
    const container = document.getElementById('deckContainer');
    container.innerHTML = '';

    pages.forEach((p, index) => {
      const card = document.createElement('div');
      card.className = 'ruina-card';
      card.setAttribute('data-rarity', p.rarity);

      // 攻撃タイプアイコンの表示切替
      let typeSymbol = "⚔️";
      if (p.range === "遠距離") typeSymbol = "🏹";
      if (p.range === "防御") typeSymbol = "🛡️";

      card.innerHTML = `
        <!-- カード左面 (アート・ヘッダー) -->
        <div class="card-left">
          <div class="card-banner">
            <div class="cost-circle">${p.cost}</div>
            <input type="text" class="card-name-input" value="${p.name}" placeholder="ページ名" onchange="pages[${index}].name = this.value">
            <div class="type-icon">${typeSymbol}</div>
          </div>
          <div class="card-art-area">
            CARD ART AREA
          </div>
          <div class="card-controls">
            <input type="number" style="width:45px;" value="${p.cost}" placeholder="コスト" onchange="pages[${index}].cost = Number(this.value); renderPages();">
            <select style="flex:1;" onchange="pages[${index}].range = this.value; renderPages();">
              <option value="近接" ${p.range==='近接'?'selected':''}>近接</option>
              <option value="遠距離" ${p.range==='遠距離'?'selected':''}>遠距離</option>
              <option value="防御" ${p.range==='防御'?'selected':''}>防御</option>
            </select>
            <select style="flex:1;" onchange="pages[${index}].rarity = this.value; renderPages();">
              <option value="paper" ${p.rarity==='paper'?'selected':''}>ペーパー</option>
              <option value="common" ${p.rarity==='common'?'selected':''}>一般 (緑)</option>
              <option value="uncommon" ${p.rarity==='uncommon'?'selected':''}>高級 (青)</option>
              <option value="rare" ${p.rarity==='rare'?'selected':''}>限定 (紫)</option>
              <option value="unique" ${p.rarity==='unique'?'selected':''}>芸術 (金)</option>
            </select>
          </div>
        </div>

        <!-- カード右面 (効果・ダイスリスト) -->
        <div class="card-right">
          <textarea placeholder="使用時効果やダイスを記載\n例:\n使用時 ページを1枚引く\n\n[斬撃] 4-8\n[打撃] 3-7\n[回避] 2-6" onchange="pages[${index}].detail = this.value">${p.detail}</textarea>
          <div class="card-footer-btns">
            <button type="button" class="btn btn-danger" onclick="removePage(${index})">DELETE</button>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function addPage() {
    pages.push({ name: "", cost: 0, range: "近接", rarity: "common", detail: "" });
    renderPages();
  }

  function removePage(index) {
    pages.splice(index, 1);
    renderPages();
  }

  renderPages();

  // ココフォリア用JSONコピー
  function copyCcfoliaJson() {
    const name = document.getElementById('charName').value || "名無しのキャラクター";
    const charClass = document.getElementById('charClass').value || "肩書きなし";
    const hp = Number(document.getElementById('hp').value);
    const stagger = Number(document.getElementById('stagger').value);
    const light = Number(document.getElementById('light').value);
    const speedDiceCount = document.getElementById('speedDiceCount').value;
    const speedDiceFormula = document.getElementById('speedDiceFormula').value;
    
    const resSlash = document.getElementById('resSlash').value;
    const resPierce = document.getElementById('resPierce').value;
    const resBlunt = document.getElementById('resBlunt').value;

    let palette = `// --- 速度ダイス ---\n`;
    for(let i=1; i<=speedDiceCount; i++) {
      palette += `(${speedDiceFormula}) 速度ダイス${i}\n`;
    }

    palette += `\n// --- バトルページ (デッキ) ---\n`;
    pages.forEach(p => {
      const pageName = p.name || "名称未設定";
      palette += `【${pageName}】(Cost:${p.cost} / ${p.range})\n${p.detail}\n\n`;
    });

    palette += `// --- 耐性 ---
斬撃:${resSlash} / 貫通:${resPierce} / 打撃:${resBlunt}\n`;

    const ccfoliaData = {
      kind: "character",
      data: {
        name: name,
        memo: `肩書き: ${charClass}\n\n【耐性】\n斬撃: ${resSlash}\n貫通: ${resPierce}\n打撃: ${resBlunt}`,
        status: [
          { label: "HP", value: hp, max: hp },
          { label: "混乱抵抗", value: stagger, max: stagger },
          { label: "光", value: light, max: light }
        ],
        params: [
          { label: "速度数", value: String(speedDiceCount) }
        ],
        commands: palette
      }
    };

    navigator.clipboard.writeText(JSON.stringify(ccfoliaData)).then(() => {
      const msg = document.getElementById('statusMsg');
      msg.innerText = "◆ COPIED TO CLIPBOARD (ココフォリア画面で Ctrl+V してください) ◆";
      setTimeout(() => msg.innerText = "", 4000);
    }).catch(err => {
      alert("コピーに失敗しました: " + err);
    });
  }
</script>
</body>
</html>
