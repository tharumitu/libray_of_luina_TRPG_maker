<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library of Ruina TRPG Character Sheet</title>
  <!-- 画像保存用の外部ライブラリ (html2canvas) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Serif+JP:wght@500;700;900&display=swap');

    :root {
      --bg-dark: #070709;
      --panel-bg: rgba(15, 15, 18, 0.9);
      --border-gold: #c5a059;
      --border-gold-dark: #5c4722;
      --text-main: #e2ded0;
      --text-gold: #e8c374;
      --text-muted: #8a8880;

      /* レアリティカラー */
      --rarity-paper: #8a8e91;
      --rarity-common: #2d8a34;
      --rarity-uncommon: #226bba;
      --rarity-rare: #8222ba;
      --rarity-unique: #c48b18;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Cinzel', 'Noto Serif JP', serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(20, 20, 30, 0.8), #030304),
        linear-gradient(rgba(197, 160, 89, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(197, 160, 89, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      color: var(--text-main);
      margin: 0;
      padding: 30px 15px;
      min-height: 100vh;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--panel-bg);
      border: 2px solid var(--border-gold);
      box-shadow: 0 0 20px rgba(0,0,0,0.9), inset 0 0 15px rgba(0,0,0,0.8);
      padding: 30px;
      position: relative;
    }

    .header {
      text-align: center;
      border-bottom: 2px solid var(--border-gold);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 2.2rem;
      color: var(--text-gold);
      letter-spacing: 4px;
      margin: 0;
      text-shadow: 0 0 10px rgba(232, 195, 116, 0.4);
    }

    .section-title {
      color: var(--text-gold);
      font-size: 1.1rem;
      letter-spacing: 2px;
      border-left: 4px solid var(--border-gold);
      padding-left: 10px;
      margin-top: 30px;
      margin-bottom: 15px;
      background: linear-gradient(90deg, rgba(197, 160, 89, 0.15), transparent);
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }

    .form-group { margin-bottom: 15px; }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      background: #0d0d11;
      border: 1px solid var(--border-gold-dark);
      color: var(--text-main);
      padding: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--border-gold);
      box-shadow: 0 0 8px rgba(197, 160, 89, 0.4);
    }

    /* 一括インポートエリア */
    .import-box {
      background: #0d0e12;
      border: 1px solid var(--border-gold-dark);
      padding: 15px;
      margin-bottom: 20px;
    }

    .import-box textarea {
      height: 120px;
      font-size: 0.85rem;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    /* --- 縦型カードレイアウト --- */
    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 25px;
      margin-bottom: 25px;
    }

    .card-wrapper {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .single-card {
      width: 100%;
      min-height: 280px;
      background: #0b0c10;
      border: 3px solid var(--rarity-common);
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .single-card[data-rarity="paper"] { border-color: var(--rarity-paper); }
    .single-card[data-rarity="common"] { border-color: var(--rarity-common); }
    .single-card[data-rarity="uncommon"] { border-color: var(--rarity-uncommon); }
    .single-card[data-rarity="rare"] { border-color: var(--rarity-rare); }
    .single-card[data-rarity="unique"] { border-color: var(--rarity-unique); }

    .card-banner {
      background: var(--rarity-common);
      height: 40px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
    .single-card[data-rarity="paper"] .card-banner { background: var(--rarity-paper); }
    .single-card[data-rarity="common"] .card-banner { background: var(--rarity-common); }
    .single-card[data-rarity="uncommon"] .card-banner { background: var(--rarity-uncommon); }
    .single-card[data-rarity="rare"] .card-banner { background: var(--rarity-rare); }
    .single-card[data-rarity="unique"] .card-banner { background: var(--rarity-unique); }

    .cost-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #070709;
      border: 2px solid #fff;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1rem;
      flex-shrink: 0;
      box-shadow: 0 0 6px rgba(0,0,0,0.8);
    }

    .card-title-display {
      color: #fff;
      font-weight: bold;
      font-size: 0.9rem;
      width: 100%;
      text-shadow: 1px 1px 3px #000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .type-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0,0,0,0.7);
      border: 1px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #fff;
      flex-shrink: 0;
    }

    /* 画像用ART AREA */
    .card-art-area {
      width: 100%;
      height: 130px;
      background: #000;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-art-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-text-area {
      flex: 1;
      padding: 12px;
      background: #060608;
      color: #e2ded0;
      font-size: 0.85rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
      min-height: 200px;
    }

    /* カードテキスト内アイコン画像 */
    .inline-dice-icon {
      width: 18px;
      height: 18px;
      vertical-align: sub;
      margin-right: 2px;
    }

    .card-edit-panel {
      background: #111217;
      border: 1px solid var(--border-gold-dark);
      padding: 8px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .edit-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .edit-row label {
      font-size: 0.75rem;
      margin: 0;
      white-space: nowrap;
    }

    .edit-row input, .edit-row select, .edit-row textarea {
      font-size: 0.75rem;
      padding: 3px 6px;
    }

    .file-input {
      font-size: 0.7rem !important;
      padding: 2px !important;
    }

    .img-input-box {
      background: rgba(0,0,0,0.3);
      padding: 6px;
      border: 1px solid rgba(197, 160, 89, 0.2);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .img-mode-selector {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      gap: 10px;
      margin-bottom: 2px;
    }

    .img-mode-selector label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    /* ボタン */
    .btn {
      background: linear-gradient(180deg, #2a251a, #14120d);
      border: 1px solid var(--border-gold);
      color: var(--text-gold);
      padding: 10px 20px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: linear-gradient(180deg, #423a28, #221e15);
      color: #fff;
      box-shadow: 0 0 10px rgba(232, 195, 116, 0.4);
    }

    .btn-import {
      background: linear-gradient(180deg, #1d334a, #0d1926);
      border-color: #2864a6;
      color: #92c5fd;
      width: 100%;
    }

    .btn-save {
      background: linear-gradient(180deg, #1b4722, #0d2411);
      border-color: #3d8c40;
      color: #a3f7a7;
      font-size: 0.75rem;
      padding: 4px 8px;
      width: 100%;
    }

    .btn-add {
      width: 100%;
      background: rgba(15, 15, 20, 0.8);
      border: 1px dashed var(--border-gold-dark);
      color: var(--text-muted);
      padding: 12px;
    }

    .btn-danger {
      background: rgba(60, 10, 10, 0.8);
      border: 1px solid #8b2525;
      color: #ffaaaa;
      padding: 4px 8px;
      font-size: 0.75rem;
      width: 100%;
    }

    .btn-remove-img {
      background: #3a2222;
      border: 1px solid #8b3d3d;
      color: #ffb8b8;
      font-size: 0.7rem;
      padding: 2px 5px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-sm {
      padding: 3px 6px;
      font-size: 0.7rem;
    }

    .btn-ccfolia {
      background: linear-gradient(180deg, #8c6e33, #423213);
      border: 2px solid var(--border-gold);
      color: #fff;
      font-size: 1.1rem;
      width: 100%;
      padding: 16px;
      margin-top: 25px;
    }

    #statusMsg {
      text-align: center;
      color: #28b5c4;
      font-weight: bold;
      margin-top: 15px;
      height: 20px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>LIBRARY OF RUINA</h1>
    <div style="font-size:0.8rem; color:var(--text-muted);">TRPG CHARACTER & BATTLE PAGE SYSTEM</div>
  </div>

  <!-- 基本情報 -->
  <div class="section-title">SPECIFICATION // 基本情報</div>
  <div class="grid-2">
    <div class="form-group">
      <label>名前 (NAME)</label>
      <input type="text" id="charName" value="" placeholder="キャラクター名を入力">
    </div>
    <div class="form-group">
      <label>肩書き (TITLE)</label>
      <input type="text" id="charClass" value="" placeholder="例: 9級フィクサー / 漆黒の苦痛">
    </div>
  </div>

  <!-- ステータス -->
  <div class="section-title">VITAL STATUS // ステータス</div>
  <div class="grid-3">
    <div class="form-group">
      <label>体力 (HP)</label>
      <input type="number" id="hp" value="50">
    </div>
    <div class="form-group">
      <label>混乱抵抗値 (STAGGER)</label>
      <input type="number" id="stagger" value="30">
    </div>
    <div class="form-group">
      <label>最大光 (MAX LIGHT)</label>
      <input type="number" id="light" value="3">
    </div>
  </div>
  <div class="grid-2">
    <div class="form-group">
      <label>速度ダイス数</label>
      <input type="number" id="speedDiceCount" value="1">
    </div>
    <div class="form-group">
      <label>速度ダイス面 (例: 1d6)</label>
      <input type="text" id="speedDiceFormula" value="1d6">
    </div>
  </div>

  <!-- 攻撃耐性 -->
  <div class="section-title">RESISTANCE // 攻撃耐性</div>
  <div class="grid-3">
    <div class="form-group">
      <label>斬撃 (SLASH)</label>
      <select id="resSlash">
        <option value="脆弱(x2.0)">脆弱 (x2.0)</option>
        <option value="一般(x1.0)" selected>一般 (x1.0)</option>
        <option value="耐性(x0.5)">耐性 (x0.5)</option>
      </select>
    </div>
    <div class="form-group">
      <label>貫通 (PIERCE)</label>
      <select id="resPierce">
        <option value="脆弱(x2.0)">脆弱 (x2.0)</option>
        <option value="一般(x1.0)" selected>一般 (x1.0)</option>
        <option value="耐性(x0.5)">耐性 (x0.5)</option>
      </select>
    </div>
    <div class="form-group">
      <label>打撃 (BLUNT)</label>
      <select id="resBlunt">
        <option value="脆弱(x2.0)">脆弱 (x2.0)</option>
        <option value="一般(x1.0)" selected>一般 (x1.0)</option>
        <option value="耐性(x0.5)">耐性 (x0.5)</option>
      </select>
    </div>
  </div>

  <!-- バトルページ（カード）構築 -->
  <div class="section-title">DECK BUILD // バトルページ構築</div>

  <!-- テキスト一括読み込み欄 -->
  <div class="import-box">
    <label>テキストから一括生成（ここにコピペ）:</label>
    <textarea id="importText" placeholder="例：
3･突破-光0 近
貫1d5 的中|光を1回復

1･落涙-光3 近
戦闘開始|NE1蓄積
斬1d3+2 的中|混乱ダメージを5与える"></textarea>
    <button type="button" class="btn btn-import" onclick="parseTextToPages()">⚡ テキストからカードを一括読み込み</button>
  </div>

  <!-- カード一覧 -->
  <div id="deckContainer" class="deck-grid"></div>
  
  <button type="button" class="btn btn-add" onclick="addPage()">+ 手動でカードを1枚追加</button>

  <!-- 出力 -->
  <button type="button" class="btn btn-ccfolia" onclick="copyCcfoliaJson()">
    EXPORT TO CCFOLIA (ココフォリア出力)
  </button>
  <div id="statusMsg"></div>
</div>

<script>
  let pages = [];

  // アイコンURL定義
  const ICON_MAP = {
    '打': 'https://static.wikia.nocookie.net/library-of-ruina/images/a/a2/H.png/revision/latest/scale-to-width-down/24?cb=20200531142341&path-prefix=ja',
    '貫': 'https://static.wikia.nocookie.net/library-of-ruina/images/3/36/P.png/revision/latest/scale-to-width-down/24?cb=20200531142321&path-prefix=ja',
    '斬': 'https://static.wikia.nocookie.net/library-of-ruina/images/8/82/S.png/revision/latest/scale-to-width-down/24?cb=20200531142418&path-prefix=ja',
    '防': 'https://static.wikia.nocookie.net/library-of-ruina/images/f/f7/G.png/revision/latest/scale-to-width-down/24?cb=20200531142349&path-prefix=ja',
    '光': 'https://static.wikia.nocookie.net/library-of-ruina/images/a/a6/Light.png/revision/latest/scale-to-width-down/20?cb=20200609120919&path-prefix=ja'
  };

  // テキスト内の指定文字の前にアイコン画像を挿入する関数
  function parseDiceIcons(text) {
    if (!text) return "テキストを入力";
    
    // HTML特殊文字を安全に置換
    let safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    // 斬・貫・打・防・光 の前に対応する <img> タグを挟み込む
    return safeText.replace(/([斬貫打防光])/g, (match, char) => {
      const iconUrl = ICON_MAP[char];
      if (iconUrl) {
        return `<img src="${iconUrl}" class="inline-dice-icon" alt="${char}" crossorigin="anonymous">${char}`;
      }
      return char;
    });
  }

  function parseTextToPages() {
    const rawText = document.getElementById('importText').value.trim();
    if (!rawText) return;

    const blocks = rawText.split(/\n\s*\n/);
    let newPages = [];

    blocks.forEach(block => {
      const lines = block.trim().split('\n');
      if (lines.length === 0) return;

      const headerLine = lines[0].trim();
      const match = headerLine.match(/^(\d+)[\s･・]*([^-\n]+)-光?(\d+)\s*(近|遠|防|近接|遠距離|防御)?/);

      if (match) {
        const count = parseInt(match[1], 10) || 1;
        const name = match[2].trim();
        const cost = parseInt(match[3], 10) || 0;
        let rangeRaw = match[4] || "近接";
        
        let range = "近接";
        if (rangeRaw.includes("遠")) range = "遠距離";
        if (rangeRaw.includes("防")) range = "防御";

        const detail = lines.slice(1).join('\n').trim();

        for (let i = 0; i < count; i++) {
          newPages.push({
            name: name,
            cost: cost,
            range: range,
            rarity: "common",
            detail: detail,
            imageSrc: null,
            imgMode: "file"
          });
        }
      } else {
        newPages.push({
          name: headerLine,
          cost: 0,
          range: "近接",
          rarity: "common",
          detail: lines.slice(1).join('\n').trim(),
          imageSrc: null,
          imgMode: "file"
        });
      }
    });

    pages = pages.concat(newPages);
    renderPages();
    document.getElementById('importText').value = '';
  }

  function renderPages() {
    const container = document.getElementById('deckContainer');
    container.innerHTML = '';

    pages.forEach((p, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'card-wrapper';

      let typeSymbol = "⚔️";
      if (p.range === "遠距離") typeSymbol = "🏹";
      if (p.range === "防御") typeSymbol = "🛡️";

      const artAreaHtml = p.imageSrc ? `
        <div class="card-art-area">
          <img src="${p.imageSrc}" alt="card art" crossorigin="anonymous">
        </div>
      ` : '';

      const isUrlMode = p.imgMode === "url";

      wrapper.innerHTML = `
        <!-- カード本体 -->
        <div class="single-card" id="card-node-${index}" data-rarity="${p.rarity}">
          <div class="card-banner">
            <div class="cost-circle">${p.cost}</div>
            <div class="card-title-display">${p.name || "名称未設定"}</div>
            <div class="type-icon">${typeSymbol}</div>
          </div>
          ${artAreaHtml}
          <div class="card-text-area">${parseDiceIcons(p.detail)}</div>
        </div>

        <!-- 編集パネル -->
        <div class="card-edit-panel">
          <div class="edit-row">
            <label>名前:</label>
            <input type="text" value="${p.name}" placeholder="ページ名" oninput="pages[${index}].name = this.value; updateCardView(${index});">
          </div>

          <div class="edit-row">
            <label>コスト:</label>
            <input type="number" value="${p.cost}" style="width:50px;" onchange="pages[${index}].cost = Number(this.value); renderPages();">
            
            <select style="flex:1;" onchange="pages[${index}].range = this.value; renderPages();">
              <option value="近接" ${p.range==='近接'?'selected':''}>近接</option>
              <option value="遠距離" ${p.range==='遠距離'?'selected':''}>遠距離</option>
              <option value="防御" ${p.range==='防御'?'selected':''}>防御</option>
            </select>
          </div>

          <div class="edit-row">
            <label>レア:</label>
            <select style="flex:1;" onchange="pages[${index}].rarity = this.value; renderPages();">
              <option value="paper" ${p.rarity==='paper'?'selected':''}>ペーパー</option>
              <option value="common" ${p.rarity==='common'?'selected':''}>一般 (緑)</option>
              <option value="uncommon" ${p.rarity==='uncommon'?'selected':''}>高級 (青)</option>
              <option value="rare" ${p.rarity==='rare'?'selected':''}>限定 (紫)</option>
              <option value="unique" ${p.rarity==='unique'?'selected':''}>芸術 (金)</option>
            </select>
          </div>

          <!-- 画像設定エリア -->
          <div class="img-input-box">
            <div class="img-mode-selector">
              <span>画像追加:</span>
              <label><input type="radio" name="imgMode_${index}" value="file" ${!isUrlMode?'checked':''} onchange="pages[${index}].imgMode='file'; renderPages();">ファイル</label>
              <label><input type="radio" name="imgMode_${index}" value="url" ${isUrlMode?'checked':''} onchange="pages[${index}].imgMode='url'; renderPages();">URL</label>
            </div>

            ${!isUrlMode ? `
              <div class="edit-row">
                <input type="file" class="file-input" accept="image/*" onchange="handleImageUpload(event, ${index})">
                ${p.imageSrc ? `<button type="button" class="btn-remove-img" onclick="removeCardImage(${index})">削除</button>` : ''}
              </div>
            ` : `
              <div class="edit-row">
                <input type="text" id="urlInput_${index}" placeholder="https://..." value="${p.imageSrc && p.imageSrc.startsWith('http') ? p.imageSrc : ''}">
                <button type="button" class="btn btn-sm" onclick="applyImageUrl(${index})">適用</button>
                ${p.imageSrc ? `<button type="button" class="btn-remove-img" onclick="removeCardImage(${index})">削除</button>` : ''}
              </div>
            `}
          </div>

          <div>
            <label>効果・ダイス情報:</label>
            <textarea style="height:60px; resize:vertical;" placeholder="テキストを入力" oninput="pages[${index}].detail = this.value; updateCardView(${index});">${p.detail}</textarea>
          </div>

          <div class="edit-row" style="margin-top:4px;">
            <button type="button" class="btn btn-save" onclick="downloadCardImage(${index})">📷 画像として保存</button>
            <button type="button" class="btn btn-danger" onclick="removePage(${index})">削除</button>
          </div>
        </div>
      `;
      container.appendChild(wrapper);
    });
  }

  function handleImageUpload(event, index) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      pages[index].imageSrc = e.target.result;
      renderPages();
    };
    reader.readAsDataURL(file);
  }

  function applyImageUrl(index) {
    const input = document.getElementById(`urlInput_${index}`);
    if (input && input.value.trim()) {
      pages[index].imageSrc = input.value.trim();
      renderPages();
    }
  }

  function removeCardImage(index) {
    pages[index].imageSrc = null;
    renderPages();
  }

  function updateCardView(index) {
    const cardNode = document.getElementById(`card-node-${index}`);
    if (!cardNode) return;

    const titleDisplay = cardNode.querySelector('.card-title-display');
    const textArea = cardNode.querySelector('.card-text-area');

    titleDisplay.textContent = pages[index].name || "名称未設定";
    textArea.innerHTML = parseDiceIcons(pages[index].detail);
  }

  function downloadCardImage(index) {
    const cardElement = document.getElementById(`card-node-${index}`);
    const cardName = pages[index].name || `battle-page-${index + 1}`;

    html2canvas(cardElement, {
      backgroundColor: null,
      scale: 1,
      useCORS: true
    }).then(canvas => {
      const link = document.createElement('a');
      link.download = `${cardName}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }

  function addPage() {
    pages.push({ name: "", cost: 0, range: "近接", rarity: "common", detail: "", imageSrc: null, imgMode: "file" });
    renderPages();
  }

  function removePage(index) {
    pages.splice(index, 1);
    renderPages();
  }

  renderPages();

  // ココフォリア用JSONコピー
  function copyCcfoliaJson() {
    const name = document.getElementById('charName').value || "名無しのキャラクター";
    const charClass = document.getElementById('charClass').value || "肩書きなし";
    const hp = Number(document.getElementById('hp').value);
    const stagger = Number(document.getElementById('stagger').value);
    const light = Number(document.getElementById('light').value);
    const speedDiceCount = document.getElementById('speedDiceCount').value;
    const speedDiceFormula = document.getElementById('speedDiceFormula').value;
    
    const resSlash = document.getElementById('resSlash').value;
    const resPierce = document.getElementById('resPierce').value;
    const resBlunt = document.getElementById('resBlunt').value;

    let palette = `// --- 速度ダイス ---\n`;
    for(let i=1; i<=speedDiceCount; i++) {
      palette += `(${speedDiceFormula}) 速度ダイス${i}\n`;
    }

    palette += `\n// --- バトルページ (デッキ) ---\n`;
    pages.forEach(p => {
      const pageName = p.name || "名称未設定";
      palette += `【${pageName}】(Cost:${p.cost} / ${p.range})\n${p.detail}\n\n`;
    });

    palette += `// --- 耐性 ---
斬撃:${resSlash} / 貫通:${resPierce} / 打撃:${resBlunt}\n`;

    const ccfoliaData = {
      kind: "character",
      data: {
        name: name,
        memo: `肩書き: ${charClass}\n\n【耐性】\n斬撃: ${resSlash}\n貫通: ${resPierce}\n打撃: ${resBlunt}`,
        status: [
          { label: "HP", value: hp, max: hp },
          { label: "混乱抵抗", value: stagger, max: stagger },
          { label: "光", value: light, max: light }
        ],
        params: [
          { label: "速度数", value: String(speedDiceCount) }
        ],
        commands: palette
      }
    };

    navigator.clipboard.writeText(JSON.stringify(ccfoliaData)).then(() => {
      const msg = document.getElementById('statusMsg');
      msg.innerText = "◆ COPIED TO CLIPBOARD (ココフォリア画面で Ctrl+V してください) ◆";
      setTimeout(() => msg.innerText = "", 4000);
    }).catch(err => {
      alert("コピーに失敗しました: " + err);
    });
  }
</script>
</body>
</html>
